<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Test pub 3D — KORA</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Black.otf"); font-weight: 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b1d24; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #fff;
      }
      .bg { position: absolute; inset: 0; }
      #bg-cold { background: radial-gradient(120% 80% at 50% 60%, #4a4f5c 0%, #1b1d24 70%); }
      #bg-warm { background: radial-gradient(120% 80% at 50% 60%, #f6b45c 0%, #c4572a 55%, #4a1a12 100%); opacity: 0; }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .text-scene {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 80px;
      }
      .top { top: 150px; }
      .bottom { bottom: 170px; }
      .hook { font-size: 92px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; max-width: 920px; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55); }
      .brand { font-size: 150px; font-weight: 900; letter-spacing: 0.12em; color: #fff4dc; text-shadow: 0 8px 40px rgba(90, 30, 0, 0.6); }
      .sub { margin-top: 18px; font-size: 54px; font-weight: 700; line-height: 1.1; max-width: 880px; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); }
      .pill { display: block; padding: 22px 44px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #5a1d0c; font-size: 50px; font-weight: 800; }
      .pill + .pill { margin-top: 22px; }
      .cta-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 46px 64px 54px;
        border-radius: 48px;
        background: #fff;
        color: #2a0f06;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .price { font-size: 128px; font-weight: 900; letter-spacing: -0.03em; color: #c4572a; line-height: 1; }
      .cod { margin-top: 14px; font-size: 46px; font-weight: 700; }
      .btn { display: block; margin-top: 30px; padding: 26px 60px; border-radius: 999px; background: #1f9d55; color: #fff; font-size: 52px; font-weight: 900; }
      .tag { position: absolute; top: 48px; left: 48px; font-size: 26px; font-weight: 600; opacity: 0.55; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="bg-cold" class="bg"></div>
      <div id="bg-warm" class="bg"></div>
      <canvas id="three-layer" width="1080" height="1920"></canvas>

      <section id="s-hook" class="clip text-scene top" data-start="0" data-duration="2.6" data-track-index="1">
        <h1 id="hook-text" class="hook">Tes cheveux cassent à chaque coiffage ?</h1>
      </section>

      <section id="s-brand" class="clip text-scene top" data-start="2.6" data-duration="2.8" data-track-index="1">
        <div id="brand-text" class="brand">KORA</div>
        <p id="brand-sub" class="sub">7 huiles naturelles pour des cheveux forts</p>
      </section>

      <section id="s-proof" class="clip text-scene bottom" data-start="5.4" data-duration="2.6" data-track-index="1">
        <span id="pill-1" class="pill">Sans silicone</span>
        <span id="pill-2" class="pill">100 % naturelle</span>
      </section>

      <section id="s-cta" class="clip text-scene bottom" data-start="8" data-duration="2" data-track-index="1">
        <div id="cta-card" class="cta-card">
          <div class="price">15 000 FCFA</div>
          <div class="cod">Paiement à la livraison</div>
          <span id="cta-btn" class="btn">Commande maintenant</span>
        </div>
      </section>

      <div class="tag">TEST HYPERFRAMES · 3D</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook-text", { opacity: 0, y: 60, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.1);
      tl.to("#hook-text", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 2.3);

      tl.to("#bg-warm", { opacity: 1, duration: 0.9, ease: "power2.out" }, 2.6);
      tl.fromTo("#brand-text", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 3.0);
      tl.fromTo("#brand-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.4);
      tl.to(["#brand-text", "#brand-sub"], { opacity: 0, duration: 0.25 }, 5.15);

      tl.fromTo("#pill-1", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.4)" }, 5.5);
      tl.fromTo("#pill-2", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.4)" }, 5.75);
      tl.to(["#pill-1", "#pill-2"], { opacity: 0, duration: 0.25 }, 7.75);

      tl.fromTo("#cta-card", { opacity: 0, y: 160, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 8.05);
      tl.fromTo("#cta-btn", { scale: 1 }, { scale: 1.07, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.6);

      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const W = 1080, H = 1920;
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);

      const hemi = new THREE.HemisphereLight(0xfff1dd, 0x3a2a30, 1.6);
      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(2.5, 4, 3);
      const rim = new THREE.DirectionalLight(0xffb36b, 1.8);
      rim.position.set(-3, 2.5, -2.5);
      scene.add(hemi, key, rim);

      // Ombre douce au sol
      const shadowCanvas = document.createElement("canvas");
      shadowCanvas.width = shadowCanvas.height = 256;
      const sctx = shadowCanvas.getContext("2d");
      const grad = sctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, "rgba(0,0,0,0.55)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, 256, 256);
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 1.6),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.002;
      scene.add(shadow);

      // Flacon KORA (procédural)
      const bottle = new THREE.Group();
      const glass = new THREE.MeshStandardMaterial({ color: 0xb8620f, roughness: 0.12, metalness: 0.15, emissive: 0x3a1500, emissiveIntensity: 0.4 });
      const gold = new THREE.MeshStandardMaterial({ color: 0xd8a640, roughness: 0.25, metalness: 0.9 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.34, 48), glass);
      body.position.y = 0.17;
      const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.13, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), glass);
      shoulder.position.y = 0.34;
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.08, 32), glass);
      neck.position.y = 0.49;
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.1, 32), gold);
      cap.position.y = 0.57;
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 1024;
      labelCanvas.height = 256;
      const lctx = labelCanvas.getContext("2d");
      lctx.fillStyle = "#fff4dc";
      lctx.fillRect(0, 0, 1024, 256);
      lctx.fillStyle = "#5a1d0c";
      lctx.textAlign = "center";
      lctx.font = "900 120px sans-serif";
      lctx.fillText("KORA", 256, 150);
      lctx.font = "700 40px sans-serif";
      lctx.fillText("HUILE CAPILLAIRE", 256, 210);
      const labelTex = new THREE.CanvasTexture(labelCanvas);
      labelTex.colorSpace = THREE.SRGBColorSpace;
      const label = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1315, 0.1315, 0.16, 48, 1, true),
        new THREE.MeshStandardMaterial({ map: labelTex, roughness: 0.6 }),
      );
      label.position.y = 0.17;
      label.rotation.y = -Math.PI / 2;
      bottle.add(body, shoulder, neck, cap, label);
      scene.add(bottle);

      let mixer = null;
      let character = null;

      const LABEL_FACING = 0;
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const ease = (v) => 1 - Math.pow(1 - clamp01(v), 3);
      const lerp = (a, b, k) => a + (b - a) * k;

      function renderAt(t) {
        // Caméra : léger travelling, puis push vers le flacon pour le CTA
        const push = ease((t - 8) / 0.9);
        const orbit = t < 5.4 ? 0 : Math.sin((t - 5.4) * 0.6) * 0.35;
        const camX = lerp(orbit * 1.2, 0.45, push);
        const camY = lerp(1.15, 1.0, push);
        const camZ = lerp(4.6 - t * 0.04, 3.4, push);
        camera.position.set(camX, camY, camZ);
        camera.lookAt(lerp(0, 0.45, push), lerp(1.05, 0.78, push), lerp(0, 1.0, push));

        if (mixer) mixer.setTime(t < 5.4 ? 0.2 : 0.2 + (t - 5.4));

        // Flacon : tombe à 2.6 s, flotte à côté du personnage, tourne
        const drop = ease((t - 2.6) / 0.8);
        const hover = t > 3.4 ? Math.sin((t - 3.4) * 2.2) * 0.03 : 0;
        bottle.position.set(lerp(0.4, 0.45, push), lerp(lerp(3.2, 0.95, drop), 0.62, push) + hover, lerp(0.55, 1.0, push));
        bottle.rotation.y = (1 - push) * t * 1.4 + push * LABEL_FACING;
        bottle.rotation.z = (1 - drop) * 0.6;
        const big = 1 + 0.1 * ease((t - 8) / 0.9);
        bottle.scale.setScalar(t < 2.6 ? 0.0001 : big);

        renderer.render(scene, camera);
      }

      const loader = new GLTFLoader();
      const ready = loader.loadAsync("assets/michelle.glb").then((gltf) => {
        character = gltf.scene;
        const box = new THREE.Box3().setFromObject(character);
        const h = box.max.y - box.min.y;
        character.scale.setScalar(1.7 / h);
        const box2 = new THREE.Box3().setFromObject(character);
        character.position.y -= box2.min.y;
        scene.add(character);
        mixer = new THREE.AnimationMixer(character);
        const clip = gltf.animations.find((a) => a.name === "SambaDance");
        mixer.clipAction(clip).play();
        renderAt(window.__hfThreeTime || 0);
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["kora-3d"] = ready;

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
