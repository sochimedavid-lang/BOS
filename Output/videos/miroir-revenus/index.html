<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --navy: #0B1E6B; --blue: #2F5BE0; --blue2: #5C86F2; --ink: #0A1440; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #02040F; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Poppins", sans-serif; background: #02040F; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .sc { position: absolute; inset: 0; overflow: hidden; }
      .bgL { position: absolute; inset: 0; background: radial-gradient(900px 900px at 65% 78%, rgba(70,110,235,.85) 0%, rgba(70,110,235,0) 70%), linear-gradient(180deg, #E8EEFC 0%, #CFDAF8 40%, #A3B8F1 78%, #6E8DE8 100%); }
      .bgD { position: absolute; inset: 0; background: radial-gradient(1100px 1000px at 55% 92%, #2448C4 0%, #0E1F73 38%, #040A2E 68%, #01020A 100%); }

      /* Personnage-bulle */
      .per { position: absolute; width: 0; height: 0; }
      .per .bo { position: absolute; left: -270px; top: 105px; width: 540px; height: 1100px; border-radius: 270px 270px 0 0; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 92%); mask-image: linear-gradient(180deg, #000 55%, transparent 92%);
        background: linear-gradient(180deg, #B9CCFB 0%, #6F95F0 22%, #3560DA 52%, rgba(26,52,170,.6) 78%, rgba(20,40,140,0) 100%);
        box-shadow: inset 0 26px 40px rgba(255,255,255,.55), inset -30px 0 60px rgba(10,30,120,.35); }
      .per .hd { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, #FFFFFF 0%, #DCE7FF 10%, #8EAEF7 34%, #4A73E6 62%, #2A4CC8 84%, #1C389E 100%);
        box-shadow: inset -20px -26px 50px rgba(10,30,120,.45), inset 14px 16px 34px rgba(255,255,255,.55), 0 0 50px rgba(110,150,255,.35); }
      .per .hd i { position: absolute; top: 112px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.8); }
      .per .hd i.l { left: 82px; } .per .hd i.r { left: 150px; }

      /* Cartes */
      .card { position: absolute; border-radius: 30px; }
      .cardL { background: rgba(255,255,255,.82); border: 2px solid rgba(255,255,255,.95); box-shadow: 0 30px 70px rgba(30,60,170,.25); color: var(--ink); }
      .cardD { background: linear-gradient(180deg, rgba(20,34,110,.92), rgba(8,14,52,.95)); border: 2px solid rgba(120,150,255,.35); box-shadow: 0 30px 80px rgba(0,0,0,.45); color: #fff; }
      .ttl { font-weight: 600; font-size: 44px; letter-spacing: .01em; }
      .sm { font-weight: 500; font-size: 26px; }
      .row { position: absolute; left: 34px; right: 34px; height: 76px; display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 30px; white-space: nowrap; }
      .cb { width: 34px; height: 34px; border: 3px solid var(--blue); border-radius: 8px; flex: none; }
      .tagD { margin-left: auto; padding: 4px 14px; border-radius: 16px; background: #FF7A3D; color: #fff; font-size: 24px; font-weight: 700; }

      /* Coupe diagonale */
      .diag { position: absolute; inset: 0; clip-path: polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%); }
      .edge { position: absolute; left: -100px; width: 1400px; height: 10px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff 30%, #fff 70%, rgba(255,255,255,0)); transform-origin: 0 50%; box-shadow: 0 0 30px rgba(255,255,255,.9); }

      /* Verre */
      .ring { position: absolute; border-radius: 50%; border: 26px solid rgba(255,255,255,.32); box-shadow: inset 0 0 50px rgba(255,255,255,.75), 0 0 70px rgba(90,130,255,.55), inset 0 0 0 5px rgba(40,70,200,.45), 0 0 0 4px rgba(255,255,255,.6); }
      .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(140,175,255,.04) 55%, rgba(160,195,255,.22) 82%, rgba(255,255,255,.85) 96%, rgba(255,255,255,0) 100%); box-shadow: 0 0 90px rgba(120,160,255,.55), inset 0 0 60px rgba(150,190,255,.35); border: 3px solid rgba(255,255,255,.55); }
      .sphere { position: absolute; border-radius: 50%; background: radial-gradient(circle at 62% 38%, #FFFFFF 0%, #D4E2FF 12%, #7EA2F4 40%, #3A63DC 70%, #142C8C 100%); box-shadow: inset 30px -30px 80px rgba(10,30,120,.5); }

      #cap { position: absolute; z-index: 10; left: 60px; right: 60px; top: 190px; text-align: center; font-weight: 600; font-size: 50px; line-height: 1.2; color: var(--navy); }
      .anton { font-family: "Anton", sans-serif; text-transform: uppercase; color: var(--navy); line-height: .92; letter-spacing: -.01em; }
    </style>
  </head>
  <body>

      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="24.6" data-track-index="10"></audio>

            <path id="c1area" d="M0 230 C60 200 90 150 130 170 S200 220 240 160 S300 60 340 120 S410 200 450 110 S520 40 560 90 S610 150 640 120 L640 250 L0 250 Z" fill="url(#g1)"/>

          <svg style="position:absolute; left:95px; top:110px" width="250" height="220" viewBox="0 0 250 220"><path d="M70 10 L20 40 L0 100 L45 110 L45 210 L205 210 L205 110 L250 100 L230 40 L180 10 C170 40 80 40 70 10 Z" fill="#2F5BE0"/><path d="M70 10 C80 40 170 40 180 10" fill="none" stroke="#1B3CA8" stroke-width="8"/></svg>

      <!-- 5. Gagner plus / mériter plus -->
      <div id="s5" class="sc" data-layout-allow-overflow data-layout-allow-occlusion>
        <div class="bgL"></div>
        <div id="desk" class="abs" style="left:0; top:0; width:1080px; height:1920px">
          <div class="abs" style="left:-500px; top:1240px; width:2080px; height:680px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(140,165,240,.4) 40%, rgba(70,110,230,.6))"></div>
          <div id="deskP"></div>
          <div class="abs" style="left:520px; top:1050px; width:420px; height:40px; background:#F4F7FF; transform:skewX(-30deg); box-shadow:0 2px 0 rgba(0,0,0,.05)"></div>
          <div class="abs" style="left:508px; top:1090px; width:420px; height:300px; background:linear-gradient(180deg,#FFFFFF,#E3EAFB)"></div>

          <div class="abs" style="left:795px; top:1050px; width:30px; height:6px; background:#C7D3F5"></div>
          <div class="abs" style="left:420px; top:1420px; width:600px; height:60px; border-radius:50%; background:rgba(40,70,190,.18); filter:blur(14px)"></div>
        </div>
        <div id="big5" class="abs" style="left:70px; top:330px">

          <div style="overflow:hidden"><div id="b5b" class="anton" style="font-size:300px">plus</div></div>
        </div>

        <div id="lensTxt" class="abs" style="left:140px; right:140px; top:930px; text-align:center; font-weight:600; font-size:46px; color:var(--navy)">Tout le monde veut gagner plus</div>
      </div>

      <!-- 6. La vérité est simple -->

        <div id="t6" class="abs" style="left:60px; right:60px; top:930px; text-align:center; font-weight:600; font-size:52px; color:var(--navy)">La vérité est simple :</div>

      <!-- 7. Change tes habitudes (fond nuit) -->

          <div id="bub7" class="bubble" style="left:110px; top:550px; width:860px; height:860px"></div>
        </div>
        <div id="inc" class="card cardD" style="left:140px; top:900px; width:820px; height:560px; overflow:hidden">
          <div class="abs" style="left:0; right:0; bottom:-200px; height:420px; background:radial-gradient(closest-side, rgba(40,220,255,.85), rgba(40,120,255,.35) 55%, rgba(0,0,0,0))"></div>
          <div class="ttl" style="position:absolute; left:44px; top:40px; font-size:56px">Revenus</div>
          <div class="sm" style="position:absolute; left:44px; top:118px; color:#9DB1F2">après 90 jours</div>

            <path id="up" d="M20 300 C 160 300, 240 280, 320 230 S 480 90, 560 70 S 680 40, 720 30" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
          </svg>

        </div>

      <!-- 8. Envoie ce post -->
      <div id="s8" class="sc" data-layout-allow-overflow data-layout-allow-occlusion>
        <div class="bgL"></div>
        <div id="p8wrap"></div>
        <div class="abs" style="left:90px; top:700px">
          <div style="overflow:hidden; padding-right:20px"><div id="b8a" class="anton" style="font-size:310px">Envoie</div></div>

        </div>

      <div id="cap"></div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      function spring(z, w) { const wd = w * Math.sqrt(1 - z * z); return (t) => (t >= 1 ? 1 : 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t))); }
      const SP = spring(0.55, 14), SPS = spring(0.42, 20), SPH = spring(0.8, 12);

      function person(parent, x, y, s, eyes = true) {
        const p = document.createElement("div");
        p.className = "per";
        p.style.left = x + "px"; p.style.top = y + "px"; p.style.transform = `scale(${s})`;
        p.innerHTML = `<div class="bo"></div><div class="hd">${eyes ? '<i class="l"></i><i class="r"></i>' : ""}</div>`;
        (typeof parent === "string" ? $(parent) : parent).appendChild(p);
        return p;
      }

      /* ---------- construction ---------- */
      const p1 = person("#s1", 860, 1000, 0.8);
      const p1b = person("#s1", 860, 1000, 0.8);
      const p2 = person("#s2", 540, 1010, 0.42);
      const p3 = person("#s3", 790, 960, 0.82);
      const p3b = person("#d3", 220, 1560, 0.5);
      const p4 = person("#s4", 800, 980, 0.82);
      const p4b = person("#d4", 220, 1540, 0.5);
      const p5 = person("#deskP", 600, 905, 0.55);
      const p7 = person("#p7wrap", 540, 900, 0.82);
      const p7b = person("#inc", 120, 470, 0.32);
      const p8 = person("#p8wrap", 880, 1330, 0.6);

      ["#s3", "#s4"].forEach((id) => { const sc = $(id); sc.querySelectorAll(":scope > .diag, :scope > .edge").forEach((el) => sc.appendChild(el)); });
      // billes « habitudes »
      const dotsBox = $("#dots"); const dots = [];
      [[90, 980, 22], [230, 940, 14], [330, 1030, 30], [470, 950, 12], [640, 1060, 24], [760, 935, 16], [880, 1020, 34], [990, 960, 18], [410, 1110, 20]].forEach(([x, y, r]) => {
        const d = document.createElement("div"); d.className = "abs";
        Object.assign(d.style, { left: x - r + "px", top: y - r + "px", width: 2 * r + "px", height: 2 * r + "px", borderRadius: "50%", background: "radial-gradient(circle at 35% 30%, #fff, #7EA2F4 40%, #2F5BE0 80%)" });
        dotsBox.appendChild(d); dots.push(d);
      });
      // liste « À faire »
      ["Prospecter 5 clients", "Envoyer la facture", "Poster une vidéo", "Relancer Awa", "Faire la compta"].forEach((t, i) => {
        const r = document.createElement("div"); r.className = "row"; r.style.top = 110 + i * 86 + "px";
        r.innerHTML = `<span class="cb"></span><span>${t}</span><span class="tagD">demain</span>`; $("#todo").appendChild(r);
      });
      // liste « Clients »
      [["Awa", "Plus tard…"], ["Koffi", "Demain"], ["Mariam", "Je reviens vers vous"], ["Serge", "On verra"], ["Fifi", "Demain peut-être"]].forEach(([n, m], i) => {
        const r = document.createElement("div"); r.className = "row"; r.style.top = 110 + i * 96 + "px"; r.style.color = "#fff";
        r.innerHTML = `<span style="width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#7EA2F4 40%,#2F5BE0 85%)"></span><span style="width:120px">${n}</span><span class="msg" style="margin-left:auto;padding:8px 18px;border-radius:20px 20px 20px 6px;background:rgba(255,255,255,.14);font-weight:500;font-size:26px">${m}</span>`;
        $("#cli").appendChild(r);
      });

      /* ---------- sous-titres ---------- */
      const CAP = [
        [0.39, "Tes revenus", "#fff"], [0.93, "sont le reflet", "#fff"], [1.8, "de tes habitudes.", "#fff"], [2.45, "", "#fff"],
        [2.95, "Ce que tu repousses", "#0B1E6B"], [3.76, "chaque jour", "#0B1E6B"], [4.38, "finit toujours", "#0B1E6B"], [5.19, "sur ton compte en banque.", "#0B1E6B"],
        [6.67, "Tu dépenses sans compter ?", "#0B1E6B"], [7.94, "Tu gagneras", "#0B1E6B"], [8.43, "sans compter non plus.", "#0B1E6B"],
        [9.79, "Tu remets tout à demain ?", "#0B1E6B"], [10.9, "Tes clients aussi", "#0B1E6B"], [11.81, "te remettront à demain.", "#0B1E6B"],
        [13.27, "", "#0B1E6B"], [14.91, "sans devenir", "#0B1E6B"], [15.88, "quelqu'un qui mérite plus.", "#0B1E6B"],
        [17.2, "", "#0B1E6B"], [18.7, "Change tes habitudes,", "#fff"], [20.0, "et tes revenus suivent.", "#fff"],
        [21.51, "Envoie ça", "#0B1E6B"], [21.87, "à quelqu'un qui doit l'entendre.", "#0B1E6B"], [23.45, "", "#0B1E6B"],
      ];
      CAP.forEach(([t, txt, col]) => {
        tl.set("#cap", { textContent: txt, color: col }, t);
        if (txt) tl.fromTo("#cap", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
      });

      /* ---------- visibilité des scènes ---------- */

      dots.forEach((d, i) => tl.fromTo(d, { x: -120 }, { x: 120, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6 + i * 0.03));
      tl.fromTo(p2, { scale: 0.42, y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: SP }, 2.95);

      gsap.set("#fall", { strokeDasharray: fallLen, strokeDashoffset: fallLen });
      tl.to("#fall", { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 4.3);
      tl.to(dots, { opacity: 0, scale: 0.3, duration: 0.5, stagger: 0.03 }, 4.3);

      gsap.set("#fallDot", { opacity: 0 });
      tl.set("#fallDot", { opacity: 1 }, 4.3);
      tl.to(fo, { t: 1, duration: 1.3, ease: "power2.inOut", onUpdate: () => { const L = fp.getTotalLength(), q = fp.getPointAtLength(L * fo.t); gsap.set("#fallDot", { x: q.x, y: q.y }); } }, 4.3);

      [[7.25, "#minus1"], [7.7, "#minus2"]].forEach(([t, m]) => {
        tl.to("#tap", { scale: 0.75, duration: 0.08 }, t); tl.to("#tap", { scale: 1, duration: 0.25, ease: SPS }, t + 0.08);

      tl.fromTo("#inc", { y: 500, scale: 0.9 }, { y: 0, scale: 1, duration: 0.8, ease: SP }, 20.0);
      gsap.set("#up", { strokeDasharray: 900, strokeDashoffset: 900 });
      tl.to("#up", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 20.3);
      const up = $("#up"), uo = { t: 0 };
      tl.to(uo, { t: 1, duration: 1.0, ease: "power2.inOut", onUpdate: () => { const L = up.getTotalLength(), q = up.getPointAtLength(L * uo.t); gsap.set("#upDot", { x: 40 + q.x, y: 170 + q.y }); } }, 20.3);

      tl.set({}, {}, 24.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
