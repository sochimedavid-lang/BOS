<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/motion-kit.css" />
    <script src="kit/motion-kit.js"></script>
    <style>
      /* couleurs du projet : redéfinir les variables ici */
      :root { --bg: #100E0C; --acc: #F4511E; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="24" data-track-index="10"></audio>

      <!-- une scène = un .sc ; la visibilité se règle avec MK.scenes -->
      <div id="s1" class="sc" data-layout-allow-overflow data-layout-allow-occlusion>
        <div class="abs center" style="inset:0"><div class="m"><span id="t1" class="display" style="font-size:200px">Titre</span></div></div>
      </div>

      <div id="cap"></div>
    </div>
    <script>
      const TOTAL = 24;
      const tl = gsap.timeline({ paused: true });
      const E = MK.ease;

      MK.scenes(tl, [["#s1", 0, TOTAL]], TOTAL);
      MK.rise(tl, "#t1", 0.2);
      // MK.captions(tl, "#cap", CAPTIONS);  ← coller la sortie de tools/captions.py

      MK.done(tl, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
