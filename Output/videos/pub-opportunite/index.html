<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/motion-kit.css" />
    <script src="kit/motion-kit.js"></script>
    <style>
      :root { --bg: #100E0C; --acc: #F4511E; --acc2: #FF7A45; --lime: #DDF247; --tx: #F6F1EA; --mut: #A39A8F;
              --font: "Inter", sans-serif; --display: "Bricolage Grotesque", sans-serif; }
      .display { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; }
      .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,236,214,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,236,214,.05) 2px, transparent 2px); background-size: 90px 90px; }
      .warm { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 42%, #2A1A12 0%, #100E0C 70%); }
      #cap { top: 1450px; left: 60px; right: 60px; font-family: "Inter", sans-serif; font-weight: 800; font-size: 60px; line-height: 1.15; color: #fff;
             text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 26px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.9); }
      .tag { position: absolute; display: inline-flex; align-items: center; gap: 14px; padding: 16px 34px; border-radius: 999px; font-weight: 800; font-size: 44px; white-space: nowrap; }
      .tag i { width: 16px; height: 16px; border-radius: 50%; background: currentColor; display: block; }
      .ctr { left: 0; right: 0; margin: 0 auto; width: max-content; }

      /* la rue : 6 commerces */
      #street { position: absolute; inset: 0; }
      .shop { position: absolute; width: 460px; height: 340px; border-radius: 26px; background: #EFE6DA; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
      .shop .aw { position: absolute; left: 0; right: 0; top: 0; height: 74px; background: repeating-linear-gradient(90deg, var(--c) 0 46px, #fff 46px 92px); border-bottom: 6px solid rgba(0,0,0,.12); }
      .shop .sg { position: absolute; left: 24px; right: 24px; top: 90px; height: 60px; border-radius: 12px; background: #1F1A16; color: #fff; font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
      .shop .wd { position: absolute; left: 24px; top: 168px; width: 250px; height: 150px; border-radius: 14px; background: linear-gradient(160deg, #9FB7C9, #5E7487); }
      .shop .dr { position: absolute; right: 24px; top: 168px; width: 140px; height: 172px; border-radius: 14px 14px 0 0; background: var(--c); filter: brightness(.8); }
      .shop .pl { position: absolute; left: 104px; top: 198px; width: 90px; height: 90px; border-radius: 50%; background: var(--acc); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(244,81,30,.55); }
      #sh1 { left: 60px; top: 260px; --c: #E84A7F; } #sh2 { left: 560px; top: 260px; --c: #F4511E; }
      #sh3 { left: 60px; top: 640px; --c: #7B4FE0; } #sh4 { left: 560px; top: 640px; --c: #2EAD5B; }
      #sh5 { left: 60px; top: 1020px; --c: #E2A21F; } #sh6 { left: 560px; top: 1020px; --c: #2F7BE0; }
      #one { position: absolute; left: 390px; top: 590px; width: 300px; height: 300px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 18px rgba(221,242,71,.25), 0 0 120px rgba(221,242,71,.5); }
      #fewTag { top: 950px; background: #fff; color: #161311; font-size: 46px; }

      /* téléphone */
      .phone { position: absolute; border-radius: 66px; background: #0B0A09; border: 12px solid #2B2723; box-shadow: 0 50px 110px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.08); overflow: hidden; }
      .phone .notch { position: absolute; left: 50%; top: 14px; width: 130px; height: 32px; margin-left: -65px; border-radius: 20px; background: #000; z-index: 3; }
      #ph { left: 280px; top: 300px; width: 520px; height: 1060px; }
      #ph .hd { position: absolute; left: 0; right: 0; top: 60px; height: 80px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 700; font-size: 32px; color: #EDE6DC; border-bottom: 2px solid rgba(255,255,255,.07); }
      #ph .hd b { color: var(--acc2); font-size: 36px; }
      #ask { position: absolute; right: 20px; top: 170px; width: 400px; min-height: 76px; padding: 22px 26px; border-radius: 30px 30px 6px 30px; background: #2E2A26; color: #F3EEE6; font-size: 30px; line-height: 1.38; font-weight: 500; }
      #pv { position: absolute; left: 20px; top: 360px; width: 340px; height: 604px; border-radius: 24px; overflow: hidden; border: 2px solid rgba(255,255,255,.14); }
      #pv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #tagTel { left: 500px; top: 1250px; background: var(--lime); color: #161311; transform: rotate(4deg); font-size: 46px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
      #tagIA { left: 30px; top: 330px; background: #fff; color: #161311; transform: rotate(-5deg); font-size: 46px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }

      /* la formation : 3 étapes */
      #p4 { position: absolute; inset: 0; background: radial-gradient(760px 760px at 50% 30%, rgba(244,81,30,.32) 0%, rgba(244,81,30,0) 70%), #100E0C; }
      #lab { top: 250px; background: rgba(244,81,30,.16); color: var(--acc2); border: 2px solid rgba(244,81,30,.6); font-size: 36px; letter-spacing: .08em; }
      #brand { position: absolute; left: 0; right: 0; top: 360px; text-align: center; font-size: 170px; line-height: 1; }
      #brand .display { color: #fff; text-transform: none; }
      #brand .serif { color: var(--acc2); font-size: 190px; }
      .step { position: absolute; left: 70px; width: 940px; height: 190px; border-radius: 32px; background: #1D1916; border: 2px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 30px; padding: 0 36px; color: #fff; font-weight: 800; font-size: 52px; letter-spacing: -.01em; box-shadow: 0 26px 60px rgba(0,0,0,.45); }
      .step .n { font-family: var(--display); font-size: 64px; color: var(--acc2); width: 90px; flex: none; }
      .step .t { flex: 1; line-height: 1.1; }
      .step .ck { width: 90px; height: 90px; flex: none; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; }
      .step small { display: block; font-size: 34px; font-weight: 600; color: var(--mut); margin-top: 6px; }
      #st1 { top: 640px; } #st2 { top: 870px; } #st3 { top: 1100px; }

      /* garantie */
      #p5 { position: absolute; inset: 0; background: radial-gradient(800px 800px at 50% 42%, #2A2410 0%, #100E0C 70%); }
      #ring { position: absolute; left: 240px; top: 330px; width: 600px; height: 600px; }
      #seven { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 330px; line-height: 1; color: #fff; }
      #days { position: absolute; left: 0; right: 0; top: 750px; text-align: center; font-size: 70px; color: var(--lime); letter-spacing: .1em; }
      #refund { top: 1030px; background: var(--lime); color: #161311; font-size: 58px; padding: 22px 46px; }

      /* prix + bouton */
      #p6 { position: absolute; inset: 0; background: radial-gradient(900px 700px at 50% 40%, #2B1710 0%, #100E0C 70%); }
      #price { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 270px; line-height: 1.05; color: #fff; white-space: nowrap; }
      #price em { font-style: normal; color: var(--acc2); }
      #fifty { top: 660px; background: var(--lime); color: #161311; font-size: 46px; }
      #cta { position: absolute; left: 110px; width: 860px; top: 820px; padding: 40px 0; border-radius: 999px; background: var(--acc); color: #fff; text-align: center; font-weight: 800; font-size: 64px; box-shadow: 0 26px 60px rgba(244,81,30,.45); }
      #hand { position: absolute; left: 700px; top: 930px; width: 120px; height: 120px; }
      #url { position: absolute; left: 0; right: 0; top: 1070px; text-align: center; font-weight: 700; font-size: 48px; color: var(--tx); }
      #arrow { position: absolute; left: 475px; top: 1180px; width: 130px; height: 130px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="27" data-track-index="10"></audio>

      <!-- S1-S2 : la rue, chaque commerce a besoin de vidéos, très peu savent les faire -->
      <div id="s1" class="sc" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>
        <div class="warm"></div><div class="grid"></div>
        <div id="street"></div>
        <div id="one"><svg width="170" height="170" viewBox="0 0 24 24" fill="#161311"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5z"/></svg></div>
        <div id="fewTag" class="tag ctr">Très peu savent les faire</div>
      </div>

      <!-- S3 : avec l'IA, depuis ton téléphone -->
      <div id="s3" class="sc" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>
        <div class="warm"></div><div class="grid"></div>
        <div id="ph" class="phone">
          <div class="notch"></div>
          <div class="hd"><b>✳</b>Claude</div>
          <div id="ask"></div>
          <div id="pv"><video id="v-pv" src="img/menu-maquis.mp4" muted playsinline data-start="6.9" data-duration="1.95" data-media-start="0.2" data-track-index="1"></video></div>
        </div>
        <div id="tagIA" class="tag"><i style="color:var(--acc)"></i>Avec l'IA</div>
        <div id="tagTel" class="tag"><i></i>Depuis ton téléphone</div>
      </div>

      <!-- S4 : la formation, 3 étapes -->
      <div id="s4" class="sc" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>
        <div id="p4"></div>
        <div id="lab" class="tag ctr">LA FORMATION</div>
        <div id="brand"><div class="m"><span id="brandIn"><span class="display">Vibe </span><span class="serif">Motion</span></span></div></div>
        <div id="st1" class="step"><span class="n">01</span><span class="t">Créer tes vidéos<small>étape par étape</small></span><span class="ck"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#161311" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
        <div id="st2" class="step"><span class="n">02</span><span class="t">Monter ton portfolio</span><span class="ck"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#161311" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
        <div id="st3" class="step"><span class="n">03</span><span class="t">Trouver tes premiers clients</span><span class="ck"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#161311" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
      </div>

      <!-- S5 : 7 jours ou remboursé -->
      <div id="s5" class="sc" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>
        <div id="p5"></div>
        <svg id="ring" viewBox="0 0 600 600"><circle cx="300" cy="300" r="270" fill="none" stroke="rgba(221,242,71,.15)" stroke-width="26"/><circle id="arc" cx="300" cy="300" r="270" fill="none" stroke="#DDF247" stroke-width="26" stroke-linecap="round" transform="rotate(-90 300 300)"/></svg>
        <div id="seven" class="display">7</div>
        <div id="days" class="display">JOURS</div>
        <div id="refund" class="tag ctr"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#161311" stroke-width="2.6" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round"/></svg>ou remboursé</div>
      </div>

      <!-- S6 : prix + bouton -->
      <div id="s6" class="sc" data-layout-allow-overflow data-layout-allow-occlusion data-layout-allow-overlap>
        <div id="p6"></div>
        <div id="price" class="display">2 900 <em>F</em></div>
        <div id="fifty" class="tag ctr">Réservé aux 50 premiers élèves</div>
        <div id="cta">Profite de l'opportunité</div>
        <svg id="hand" viewBox="0 0 24 24" fill="#fff" stroke="#161311" stroke-width="1.2" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l.5-.1V8a1.5 1.5 0 0 1 3 0v2.2l.4-.1a1.5 1.5 0 0 1 2.6 1V15c0 3.3-2.4 6-5.7 6h-1.1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L9 15z"/></svg>
        <div id="url">www.vibemotionafrica.com</div>
        <svg id="arrow" viewBox="0 0 100 100" fill="none" stroke="#FF7A45" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M50 12v70M20 54l30 30 30-30"/></svg>
      </div>

      <div id="cap"></div>
    </div>
    <script>
      const TOTAL = 27;
      const tl = gsap.timeline({ paused: true });
      const E = MK.ease;

      // les 6 commerces de la rue
      const SHOPS = ["Boutique Awa", "Maquis Chez Tanti", "Salon Prestige", "Pharmacie du Port", "Pâtisserie Délice", "Pressing Éclat"];
      const PLAY = '<svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg>';
      SHOPS.forEach((n, i) => { const s = MK.el("div", "shop", "#street", `<div class="aw"></div><div class="sg">${n}</div><div class="wd"></div><div class="dr"></div><div class="pl">${PLAY}</div>`); s.id = "sh" + (i + 1); });

      MK.scenes(tl, [["#s1", 0, 5.6], ["#s3", 5.5, 8.85], ["#s4", 8.75, 17.95], ["#s5", 17.85, 20.85], ["#s6", 20.75, TOTAL]], TOTAL);

      /* ---------- S1 : chaque commerce a besoin de vidéos ---------- */
      gsap.set(".shop", { transformPerspective: 1200 });
      MK.pop(tl, ".shop", 0.0, { stagger: 0.22, from: 0.7 });
      gsap.set(".shop .pl", { scale: 0, opacity: 0 });
      tl.to(".shop .pl", { scale: 1, opacity: 1, duration: 0.4, ease: E.ui, stagger: 0.08 }, 2.75);
      tl.to(".shop", { y: -14, duration: 0.12, stagger: 0.08, yoyo: true, repeat: 1 }, 2.75);

      /* ---------- S2 : très peu savent les faire ---------- */
      tl.to(".shop", { opacity: 0.25, filter: "grayscale(1)", duration: 0.4 }, 3.4);
      MK.pop(tl, "#one", 4.32, { from: 0.3 });
      MK.pulse(tl, "#one", [4.95], 1.08);
      MK.pop(tl, "#fewTag", 4.53);

      /* ---------- S3 : avec l'IA, depuis ton téléphone ---------- */
      MK.wipeUp(tl, "#s3 .warm", 5.5, 0.25);
      MK.slide(tl, "#ph", 5.55, { y: 1750, dur: 0.7 });
      MK.type(tl, "#ask", "Crée la vidéo du menu de mon maquis.", 5.95, { cps: 40 });
      MK.pop(tl, "#tagIA", 5.89);
      gsap.set("#pv", { scale: 0.6, opacity: 0 });
      tl.to("#pv", { scale: 1, opacity: 1, duration: 0.5, ease: E.card }, 7.0);
      MK.pop(tl, "#tagTel", 7.9);
      tl.to("#ph", { scale: 1.03, duration: 1.4, ease: "sine.inOut" }, 7.2);

      /* ---------- S4 : la formation, 3 étapes ---------- */
      MK.wipeUp(tl, "#p4", 8.75, 0.25);
      MK.pop(tl, "#lab", 8.88);
      MK.rise(tl, "#brandIn", 9.53);
      [["#st1", 10.9, 13.5], ["#st2", 14.16, 15.13], ["#st3", 15.85, 17.28]].forEach(([s, a, b], i) => {
        MK.slide(tl, s, a, { x: i % 2 ? 1100 : -1100, dur: 0.6 });
        gsap.set(`${s} .ck`, { scale: 0, opacity: 0 });
        tl.to(`${s} .ck`, { scale: 1, opacity: 1, duration: 0.4, ease: E.ui }, b);
        tl.to(s, { borderColor: "rgba(221,242,71,.6)", duration: 0.2 }, b);
      });

      /* ---------- S5 : 7 jours ou remboursé ---------- */
      MK.circleIn(tl, "#s5", 17.85, { x: 540, y: 630, dur: 0.4 });
      const arc = document.querySelector("#arc"), AL = 2 * Math.PI * 270;
      gsap.set(arc, { strokeDasharray: AL, strokeDashoffset: AL });
      tl.to(arc, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 18.1);
      MK.stamp(tl, "#seven", 19.14);
      MK.rise(tl, "#days", 19.36, { dur: 0.5 });
      MK.pop(tl, "#refund", 19.87);

      /* ---------- S6 : prix + bouton ---------- */
      MK.wipeUp(tl, "#p6", 20.75, 0.25);
      MK.stamp(tl, "#price", 20.92);
      MK.pop(tl, "#fifty", 22.38);
      MK.pop(tl, "#cta", 23.52, { from: 0.6 });
      gsap.set("#hand", { x: 160, y: 220, opacity: 0 });
      tl.to("#hand", { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 23.9);
      tl.to("#cta", { scale: 0.94, duration: 0.08 }, 24.44);
      tl.to("#cta", { scale: 1, duration: 0.4, ease: E.ui }, 24.52);
      MK.pulse(tl, "#cta", [25.11, 26.0], 1.05);
      MK.fadeIn(tl, "#url", 24.6, 0.3);
      MK.pop(tl, "#arrow", 24.9);
      for (let k = 0; k < 5; k++) {
        tl.to("#arrow", { y: 26, duration: 0.22, ease: "power2.in" }, 25.2 + k * 0.36);
        tl.to("#arrow", { y: 0, duration: 0.14, ease: "power2.out" }, 25.42 + k * 0.36);
      }

      /* ---------- sous-titres ---------- */
      MK.captions(tl, "#cap", [
        [0.36, "Autour de toi,"],
        [1.28, "chaque commerce a besoin de vidéos."],
        [3.4, "Mais très peu de gens savent les faire."],
        [5.6, "Avec l'IA, tu peux les créer"],
        [7.32, "depuis ton téléphone."],
        [8.8, "La formation Vibe Motion"],
        [10.26, "te montre exactement comment les faire,"],
        [12.92, "étape par étape…"],
        [14.16, "comment monter ton portfolio,"],
        [15.74, "et comment trouver tes premiers clients."],
        [17.96, "Ta première vidéo en 7 jours,"],
        [19.73, "ou remboursé."],
        [20.92, "2 900 F pour les 50 premiers."],
        [23.52, "Clique sur le lien"],
        [24.44, "pour profiter de l'opportunité."],
        [26.4, ""]
      ]);

      MK.done(tl, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
