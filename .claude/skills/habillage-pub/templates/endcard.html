<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <title>Carte de fin</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat-ExtraBold.ttf"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Black.otf"); font-weight: 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }

      #bg { position: absolute; inset: -60px; width: 1200px; height: 2040px; object-fit: cover; filter: blur(26px) brightness(0.5) saturate(1.15); }
      #tint { position: absolute; inset: 0; }
      #rays { position: absolute; left: 90px; top: 210px; width: 900px; height: 900px; opacity: 0; }
      #rays svg { display: block; width: 100%; height: 100%; }
      .spark { position: absolute; display: block; width: 10px; height: 10px; border-radius: 50%; }

      #content { position: absolute; left: 0; right: 0; top: 0; height: 1920px; display: flex; flex-direction: column; align-items: center; }
      #kicker { margin-top: 250px; padding: 14px 34px; border-radius: 999px; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: 0.04em; text-transform: uppercase; color: #0b0b0b; }
      #product-wrap { position: relative; display: flex; align-items: center; justify-content: center; width: 1000px; height: 560px; margin-top: 24px; }
      #product { display: block; max-width: 700px; max-height: 560px; filter: drop-shadow(0 34px 44px rgba(0, 0, 0, 0.55)); }
      #title { margin-top: 18px; font-family: "Montserrat", sans-serif; font-weight: 800; line-height: 0.98; text-align: center; letter-spacing: 0.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); }
      #subtitle { margin-top: 14px; max-width: 900px; text-wrap: balance; font-size: 44px; font-weight: 700; line-height: 1.15; text-align: center; color: #f2f2f2; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); }
      #perks { display: flex; flex-wrap: wrap; justify-content: center; max-width: 980px; margin-top: 30px; }
      .perk { display: flex; align-items: center; margin: 8px 9px; padding: 14px 26px 14px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.95); color: #111; font-size: 36px; font-weight: 800; }
      .perk svg { display: block; width: 42px; height: 42px; margin-right: 12px; }
      #price { display: flex; align-items: baseline; margin-top: 26px; }
      #price-now { font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 92px; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); }
      #price-old { margin-left: 22px; font-size: 48px; font-weight: 700; color: rgba(255, 255, 255, 0.7); text-decoration: line-through; }
      #cta { display: flex; flex-direction: column; align-items: center; margin-top: 34px; }
      #btn { display: flex; align-items: center; padding: 30px 70px; border-radius: 999px; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 62px; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
      #btn-shine { position: absolute; left: 0; top: 0; width: 120px; height: 100%; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%); }
      #btn-inner { position: relative; overflow: hidden; border-radius: 999px; }
      #cta-note { margin-top: 18px; font-size: 32px; font-weight: 700; color: rgba(255, 255, 255, 0.92); text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
      #arrow { display: block; width: 84px; height: 84px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DURATION__">
      <section id="s-end" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0">
        <div id="stage">
          <img id="bg" src="assets/last-frame.jpg" alt="" />
          <div id="tint"></div>
          <div id="rays">
            <svg viewBox="-100 -100 200 200"><g id="rays-g"></g></svg>
          </div>
          <div id="sparks"></div>
          <div id="content">
            <div id="kicker"></div>
            <div id="product-wrap"><img id="product" alt="" /></div>
            <div id="title"></div>
            <div id="subtitle"></div>
            <div id="perks"></div>
            <div id="price"><span id="price-now"></span><span id="price-old"></span></div>
            <div id="cta">
              <div id="btn-inner"><div id="btn"></div><div id="btn-shine"></div></div>
              <div id="cta-note"></div>
              <svg id="arrow" viewBox="0 0 84 84"><path d="M42 10 L42 66 M18 44 L42 68 L66 44" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const CFG = __CONFIG__;
      const E = CFG.endcard;
      const ACCENT = E.accent || "#1f9d55";
      const HL = E.highlight_color || "#A3FB02";
      const D = CFG.duration;
      const $ = (id) => document.getElementById(id);
      $("stage").style.transform = "scale(" + CFG.scale + ")";

      // Fond : dernière image floutée + voile couleur de marque
      $("tint").style.background =
        "radial-gradient(70% 45% at 50% 32%, " + ACCENT + "88 0%, rgba(0,0,0,0) 70%), linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.6) 100%)";

      // Rayons de lumière derrière le produit
      let rays = "";
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const a2 = a + 0.12;
        rays += '<path d="M0 0 L' + (Math.cos(a) * 100).toFixed(2) + " " + (Math.sin(a) * 100).toFixed(2) + " L" + (Math.cos(a2) * 100).toFixed(2) + " " + (Math.sin(a2) * 100).toFixed(2) + ' Z" fill="rgba(255,255,255,0.09)" />';
      }
      $("rays-g").innerHTML = rays + '<circle r="38" fill="rgba(255,255,255,0.18)" />';

      // Particules (positions fixes, pseudo-aléatoire graine fixe)
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const sparks = [];
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        const size = 6 + rnd() * 10;
        s.style.width = s.style.height = size.toFixed(1) + "px";
        s.style.left = (80 + rnd() * 920).toFixed(0) + "px";
        s.style.top = (240 + rnd() * 900).toFixed(0) + "px";
        s.style.background = i % 3 === 0 ? HL : "rgba(255,255,255,0.85)";
        $("sparks").appendChild(s);
        sparks.push({ el: s, rise: 60 + rnd() * 120, delay: rnd() * 0.8 });
      }

      $("kicker").textContent = E.kicker || "";
      $("kicker").style.background = HL;
      if (!E.kicker) $("kicker").style.visibility = "hidden";

      if (E.product_image) $("product").src = "assets/" + E.product_image;
      else $("product-wrap").style.display = "none";

      $("title").textContent = E.title || "";
      $("title").style.fontSize = (E.title_size || (E.product_image ? 112 : 150)) + "px";
      $("subtitle").textContent = E.subtitle || "";
      if (!E.subtitle) $("subtitle").style.display = "none";

      const check = '<svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="20" fill="' + ACCENT + '" /><path d="M12 22 L18.5 28.5 L31 15" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>';
      (E.perks || []).forEach((p, i) => {
        const el = document.createElement("div");
        el.className = "perk";
        el.id = "perk-" + i;
        el.innerHTML = check + "<span></span>";
        el.querySelector("span").textContent = p;
        $("perks").appendChild(el);
      });

      if (E.price) {
        $("price-now").textContent = E.price;
        $("price-old").textContent = E.old_price || "";
      } else $("price").style.display = "none";

      $("btn").textContent = E.cta || "ORDER NOW";
      $("btn").style.background = ACCENT;
      $("cta-note").textContent = E.cta_note || "";
      if (!E.cta_note) $("cta-note").style.display = "none";

      function build() {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#bg", { scale: 1.12 }, { scale: 1.02, duration: D, ease: "none" }, 0);
        tl.fromTo("#tint", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
        tl.fromTo("#rays", { opacity: 0, rotation: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.15);
        tl.to("#rays", { rotation: 40, duration: D, ease: "none" }, 0);
        sparks.forEach(({ el, rise, delay }) => {
          tl.fromTo(el, { opacity: 0, y: 0 }, { opacity: 0.9, y: -rise * 0.4, duration: 0.5, ease: "power1.out" }, 0.2 + delay);
          tl.to(el, { opacity: 0, y: -rise, duration: 1.2, ease: "power1.in" }, 0.7 + delay);
        });
        tl.fromTo("#kicker", { opacity: 0, y: -40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.1);
        tl.fromTo("#product", { opacity: 0, scale: 0.4, rotation: -8, y: 80 }, { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.65, ease: "back.out(1.6)" }, 0.15);
        tl.to("#product", { y: -14, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((D - 0.8) / 0.9) - 1) }, 0.8);
        tl.fromTo("#title", { opacity: 0, y: 50, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.45);
        tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.6);
        (E.perks || []).forEach((p, i) => {
          tl.fromTo("#perk-" + i, { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2)" }, 0.75 + i * 0.12);
        });
        if (E.price) tl.fromTo("#price", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.95);
        const ctaAt = 1.0;
        tl.fromTo("#btn-inner", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, ctaAt);
        tl.fromTo("#cta-note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, ctaAt + 0.2);
        tl.fromTo("#btn-shine", { x: -160 }, { x: 760, duration: 0.7, ease: "power2.inOut" }, ctaAt + 0.45);
        const pulses = Math.max(1, Math.floor((D - ctaAt - 0.5) / 0.5));
        tl.fromTo("#btn-inner", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: pulses - 1 }, ctaAt + 0.5);
        tl.fromTo("#arrow", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3 }, ctaAt + 0.3);
        tl.fromTo("#arrow", { y: 0 }, { y: 18, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((D - ctaAt - 0.6) / 0.3)) - 1 }, ctaAt + 0.6);
        window.__timelines["main"] = tl;
      }

      Promise.all([document.fonts.load("800 40px Montserrat"), document.fonts.load("700 40px Inter")]).then(build);
    </script>
  </body>
</html>
