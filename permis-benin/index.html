<meta name="claude:viewport-fit-sides" content="cover">
<title>Permis Bénin — Révision</title>
<style>
:root{
  --bg:#eef3fb; --card:#ffffff; --ink:#15203a; --mut:#75849f; --line:#e6ecf6; --soft:#f4f7fc;
  --b1:#2f6df6; --b2:#7a3bff; --ind:#4f46e5;
  --good:#17ac57; --goodbg:#e8faef; --goodink:#0c6b35;
  --bad:#f0453f; --badbg:#fff0ef; --badink:#9c201c; --warn:#b9770f; --warnbg:#fff6e6;
  --sh:0 6px 20px rgba(45,65,120,.09); --sh2:0 10px 30px rgba(45,65,120,.14);
  --nav:#ffffff; --navmut:#9aa7bd; --navon:#2f6df6;
  color-scheme:light;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Space Grotesk','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.i{width:22px;height:22px;display:inline-block;vertical-align:middle;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.an{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes dash{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
@keyframes shimmer{0%{background-position:-180% 0}100%{background-position:180% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.an,[style*=animation]{animation:none!important}}

/* header */
.hd{display:flex;align-items:center;gap:13px;padding-top:26px;margin-bottom:20px}
.hd .mark{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(80,90,230,.3);flex-shrink:0}
.hd .mark .i{width:27px;height:27px}
.hd .ttl{flex:1;min-width:0}
.hd .ttl b{font-family:var(--disp);font-size:1.4rem;letter-spacing:-.02em;font-weight:700;display:block;line-height:1.1}
.hd .ttl span{font-size:.76rem;color:var(--mut);font-weight:500}
.hd .mute{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;color:var(--b1);flex-shrink:0}

/* segmented */
.seg{display:flex;background:#e2e9f5;border-radius:15px;padding:4px;margin-bottom:20px}
.seg button{flex:1;font-size:.84rem;font-weight:600;color:#6e7e9a;padding:10px;border-radius:11px;transition:.2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(45,65,120,.12)}

.page{padding-bottom:110px}
.sh{font-family:var(--disp);font-weight:700;font-size:1.02rem;margin:6px 2px 12px;display:flex;align-items:center;justify-content:space-between}
.sh a{font-size:.78rem;color:var(--b1);font-weight:600;text-decoration:none;display:flex;align-items:center;gap:2px}

/* hero continue */
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(130deg,var(--b1),var(--b2));box-shadow:var(--sh2);position:relative;overflow:hidden;margin-bottom:18px}
.hero .bl{position:absolute;right:-28px;top:-26px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);animation:floaty 6s ease-in-out infinite}
.hero .bl2{position:absolute;right:40px;bottom:-44px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .tag{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;opacity:.92;font-weight:700}
.hero h2{font-family:var(--disp);font-size:1.3rem;margin:7px 0 3px;position:relative}
.hero p{font-size:.82rem;opacity:.92;margin:0 0 15px;position:relative}
.hero .pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-bottom:7px}
.hero .pbar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .8s}
.hero .pr{font-size:.73rem;opacity:.96;display:flex;justify-content:space-between;max-width:72%}
.hero .go{position:absolute;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--b2);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.hero .go .i{width:24px;height:24px}

/* overview card (ring + kpis) */
.ovc{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);display:flex;align-items:center;gap:18px;margin-bottom:18px}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pc b{font-family:var(--disp);font-size:1.5rem;line-height:1}
.ring .pc span{font-size:.62rem;color:var(--mut)}
.kpis{flex:1;display:flex;flex-direction:column;gap:12px}
.kpi{display:flex;align-items:center;gap:11px}
.kpi .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi b{font-family:var(--disp);font-size:1.08rem;display:block;line-height:1.1}
.kpi span{font-size:.72rem;color:var(--mut)}

/* quick actions */
.qa{display:flex;gap:12px;margin-bottom:6px}
.qa button{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:13px;box-shadow:var(--sh);text-align:left}
.qa .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.qa b{font-family:var(--disp);font-size:.88rem;display:block} .qa span{font-size:.68rem;color:var(--mut)}

/* modes grid */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:22px}
.md{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);text-align:left;position:relative;transition:transform .08s;animation:pop .4s both}
.md:active{transform:scale(.98)}
.md .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
.md b{font-family:var(--disp);font-size:.98rem;display:block} .md span{font-size:.73rem;color:var(--mut)}
.md .bdg{position:absolute;top:14px;right:14px;min-width:22px;height:22px;background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* fiches grid */
.fiches{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fiche{background:var(--card);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--sh);transition:transform .08s}
.fiche:active{transform:scale(.97)}
.fiche .num{font-family:var(--disp);font-size:1.25rem;color:var(--b1);font-weight:700}
.fiche .lb{font-size:.66rem;color:var(--mut)}
.fiche .mini{height:5px;border-radius:9px;background:#e9eef7;margin-top:8px;overflow:hidden}
.fiche .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#3fd07f);transition:width .7s}
.fiche .mv{font-size:.6rem;color:var(--mut);margin-top:4px}
.mix{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#eef3ff,#f4edff);border:1.5px dashed #c9d4f0;color:var(--b2);font-family:var(--disp);font-weight:700;border-radius:16px;padding:14px}

/* stats bars */
.bars{background:var(--card);border-radius:20px;padding:17px;box-shadow:var(--sh);margin-bottom:18px}
.brow{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.brow:last-child{margin-bottom:0}
.brow .nm{font-size:.76rem;color:#59688a;width:52px;flex-shrink:0;font-weight:600}
.brow .track{flex:1;height:9px;border-radius:99px;background:#eef1f8;overflow:hidden}
.brow .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .7s}
.brow .vv{font-size:.72rem;color:var(--mut);width:42px;text-align:right;font-variant-numeric:tabular-nums}
.scards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.sc{background:var(--card);border-radius:18px;padding:15px;box-shadow:var(--sh)}
.sc .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.sc b{font-family:var(--disp);font-size:1.4rem;display:block;line-height:1}
.sc span{font-size:.72rem;color:var(--mut)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);box-shadow:0 -6px 22px rgba(45,65,120,.08);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:10px 8px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.64rem;font-weight:600;color:var(--navmut)}
.nav button .i{width:24px;height:24px}
.nav button.on{color:var(--navon)}

/* ===== QUIZ ===== */
.qtop{padding-top:22px;padding-bottom:2px;margin-bottom:12px}
.qrow{display:flex;align-items:center;gap:12px}
.rbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rbtn .i{width:22px;height:22px}
.qttl{flex:1;min-width:0}
.qttl b{font-family:var(--disp);font-size:1.12rem;display:block;line-height:1.15}
.qttl span{font-size:.74rem;color:var(--mut)}
.spill{display:flex;align-items:center;gap:5px;background:var(--goodbg);color:var(--goodink);font-weight:800;border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.spill .i{width:17px;height:17px;stroke:var(--good)}
.tpill{display:flex;align-items:center;gap:6px;background:#eef0ff;color:var(--ind);font-weight:800;border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.tpill .i{width:17px;height:17px}
.tpill.low{background:#ffe9e8;color:var(--bad)}.tpill.low .i{stroke:var(--bad)}
.qprog{height:9px;border-radius:99px;background:#e4ebf6;overflow:hidden;margin-top:16px}
.qprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .3s}

.qbody{padding-block:18px 40px;display:flex;flex-direction:column;gap:15px}
.qmeta{font-size:.76rem;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px}
.qmeta .pz{background:var(--soft);border-radius:8px;padding:3px 9px;color:#5a6b89}
.signwrap{display:flex;justify-content:center}
.signwrap .box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.signwrap img{width:146px;height:146px;object-fit:contain;display:block}
.q{font-size:1.16rem;font-weight:700;line-height:1.34;font-family:var(--disp)}
.opts{display:flex;flex-direction:column;gap:11px}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;font-size:.96rem;box-shadow:var(--sh);transition:transform .06s,border-color .15s}
.o:active{transform:scale(.99)}
.o .k{width:28px;height:28px;border-radius:9px;background:#eef3fb;color:#6b86a3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0;transition:.15s}
.o .lab{flex:1;min-width:0}
.o .mk{width:22px;height:22px;flex-shrink:0;opacity:0}
.o.good{background:var(--goodbg);border-color:var(--good);color:var(--goodink)}.o.good .k{background:var(--good);color:#fff}.o.good .mk{opacity:1;stroke:var(--good)}
.o.bad{background:var(--badbg);border-color:var(--bad);color:var(--badink)}.o.bad .k{background:var(--bad);color:#fff}.o.bad .mk{opacity:1;stroke:var(--bad)}
.o.dim{opacity:.5}
.expl{border-radius:16px;padding:14px 15px;font-size:.9rem;animation:rise .35s both}
.expl.ok{background:var(--goodbg);border:1px solid #bde9cd;color:#1a5c37}
.expl.ko{background:#eef5ff;border:1px solid #cfe2fb;color:#2e4663}
.expl .vd{font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.expl.ok .vd{color:var(--goodink)}.expl.ko .vd{color:var(--badink)}
.expl .vd .i{width:19px;height:19px}
.flag{margin-top:9px;background:var(--warnbg);border:1px solid #f1d59a;border-radius:10px;padding:8px 10px;font-size:.78rem;color:var(--warn);display:flex;gap:7px}
.flag .i{width:16px;height:16px;stroke:var(--warn);flex-shrink:0;margin-top:1px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(130deg,var(--b1),var(--b2));color:#fff;font-weight:700;font-family:var(--disp);border-radius:15px;padding:16px;font-size:1rem;box-shadow:var(--sh2);width:100%}
.cta:active{transform:scale(.99)}
.cta.sec{background:#fff;color:var(--b2);border:2px solid var(--line);box-shadow:var(--sh)}
.cta .i{width:20px;height:20px}

/* result */
.rhead{text-align:center;padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rring{position:relative;width:168px;height:168px;margin:6px auto}
.rring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rring .pc b{font-family:var(--disp);font-size:2.4rem;line-height:1}
.rring .pc span{font-size:.8rem;color:var(--mut)}
.vbig{font-family:var(--disp);font-size:1.35rem;font-weight:700}
.rsub{color:var(--mut);font-size:.9rem}
.review{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.rev{background:var(--card);border-radius:15px;padding:13px;box-shadow:var(--sh);border-left:4px solid var(--bad)}
.rev .rq{font-weight:600;font-size:.88rem;margin-bottom:7px}
.rev .ra{font-size:.82rem;display:flex;gap:6px;align-items:flex-start}
.rev .ra .i{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.rev .ra.g{color:var(--goodink)}.rev .ra.g .i{stroke:var(--good)}
.rev .ra.k{color:var(--badink)}.rev .ra.k .i{stroke:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:36px 14px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty .ic{width:66px;height:66px;border-radius:20px;background:var(--goodbg);color:var(--good);display:flex;align-items:center;justify-content:center}
.empty .ic .i{width:34px;height:34px}
.empty b{font-family:var(--disp);font-size:1.1rem;color:var(--ink)}
</style>

<script>
const QUESTIONS=[{"f":1,"n":1,"q":"Quelles sont les différentes signalisations routières ?","o":["La signalisation verticale, horizontale, lumineuse et les signes des agents","Les intersections en X, en Y et en T","Les lignes continues, les lignes discontinues et les lignes mixtes"],"c":0,"e":"Il existe 4 familles : verticale (panneaux), horizontale (marquages au sol), lumineuse (feux) et les signes des agents."},{"f":1,"n":2,"q":"La signalisation horizontale est :","o":["L'ensemble des marques peintes sur la chaussée","L'ensemble des signes des agents de sécurité","L'ensemble des règles applicables en agglomération"],"c":0,"e":"Horizontale = tout ce qui est peint au sol : lignes, flèches, zébras, passages piétons."},{"f":1,"n":3,"q":"La ligne continue blanche centrale :","o":["Autorise le dépassement","Interdit le dépassement","Est réservée pour l'arrêt des bus"],"c":1,"e":"Une ligne continue ne se franchit jamais : dépassement interdit."},{"f":1,"n":4,"q":"La ligne discontinue blanche centrale :","o":["Interdit la circulation à droite","Autorise le dépassement","Est réservée pour l'arrêt des bus"],"c":1,"e":"Une ligne discontinue peut être franchie : le dépassement est autorisé si la voie est libre."},{"f":1,"n":5,"q":"Les traits de la ligne discontinue blanche centrale hors agglomération ont une longueur de :","o":["20 m","1,33 m","3 m"],"c":2,"e":"Les traits mesurent 3 m, séparés par des intervalles plus longs.","flag":1},{"f":1,"n":6,"q":"La ligne mixte autorise le dépassement :","o":["Si la ligne discontinue est plus proche du conducteur","Si la ligne continue est plus proche du conducteur","Si la chaussée est assez large"],"c":0,"e":"Sur une ligne mixte, on obéit à la ligne la plus proche de soi : dépassement permis si c'est la discontinue."},{"f":1,"n":7,"q":"La ligne jaune continue sur la bordure du trottoir :","o":["Interdit le stationnement","Autorise l'arrêt","Indique une zone d'arrêt de bus"],"c":0,"e":"Jaune continue au bord = stationnement interdit."} oir un panneau de position et des rails"],"c":2,"e":"A8 = passage à niveau SANS barrière : on trouve un panneau de position et des rails."},{"f":4,"n":8,"q":"Que doit-on faire à la vue du panneau A8 ?","img":"f4q8","o":["Accélérer et passer en vérifiant la gauche et la droite","Ralentir, regarder à gauche et à droite avant de traverser les rails","Accélérer et passer tout simplement"],"c":1,"e":"Sans barrière, on ralentit et on regarde des deux côtés avant de traverser."},{"f":4,"n":9,"q":"Que doit-on faire à la rencontre du panneau A13a ?","img":"f4q9","o":["Passer en klaxonnant pour faire dégager les enfants","Ralentir, faire attention aux enfants et s'arrêter au besoin pour les laisser passer","Klaxonner et passer rapidement"],"c":1,"e":"A13a (enfants) : ralentir, rester vigilant et s'arrêter si nécessaire."},{"f":4,"n":10,"q":"À la rencontre du panneau A3, que faire lorsqu'un véhicule arrive en sens inverse ?","img":"f4q10","o":["S'arrêter et laisser le véhicule passer","Poursuivre sa route","Serrer sa droite, s'arrêter et laisser le véhicule passer"],"c":2,"e":"Chaussée rétrécie : serrer sa droite, s'arrêter si besoin et laisser passer."},{"f":4,"n":11,"q":"Que peut-on faire à la vue du panneau B1 ?","img":"f4q11","o":["Poursuivre sa route en ralentissant","Garer son véhicule","Changer de direction","Faire demi-tour"],"c":2,"e":"B1 = sens interdit : il faut changer de direction."},{"f":4,"n":12,"q":"À la vue du panneau B3 :","img":"f4q12","o":["Un véhicule peut dépasser un autre véhicule","Une voiture peut dépasser un camion","Un camion peut dépasser un autre camion","Aucun dépassement n'est autorisé"],"c":3,"e":"B3 = dépassement interdit : aucun véhicule ne doit en dépasser un autre."},{"f":4,"n":13,"q":"À la rencontre du panneau B33, il est interdit :","img":"f4q13","o":["À un véhicule poids lourd, de dépasser une voiture","À un véhicule poids lourd, de dépasser un autre poids lourd","À un petit véhicule de dépasser un poids lourd","À un poids lourd de croiser un véhicule léger"],"c":0,"e":"B33 interdit aux poids lourds de dépasser (ici, de dépasser une voiture).","flag":1},{"f":4,"n":14,"q":"À quelle vitesse peut-on rouler à la vue du panneau B14 ?","img":"f4q14","o":["À moins de 50 km/h","À 50 km/h","À plus de 50 km/h"],"c":0,"e":"B14 = vitesse limitée : on roule à 50 km/h au maximum, donc à moins de 50."},{"f":4,"n":15,"q":"Que doit-on faire à la vue du panneau B15 ?","img":"f4q15","o":["Passer sans tenir compte de l'usager venant en sens inverse","Passer en serrant sa droite","S'arrêter pour laisser l'usager venant en sens inverse"],"c":2,"e":"B15 = je cède : je m'arrête pour laisser passer celui qui vient en face."},{"f":4,"n":16,"q":"Que doit-on faire à la vue du panneau B21c1 ?","img":"f4q16","o":["Tourner immédiatement à droite","Tourner à droite à la prochaine intersection","Tourner à droite avant le panneau"],"c":0,"e":"La flèche courbée (B21c1) oblige à tourner immédiatement à droite."},{"f":4,"n":17,"q":"À quelle vitesse peut-on rouler à la vue du panneau B25 ?","img":"f4q17","o":["À moins de 30 km/h","À la vitesse voulue","À 30 km/h","À plus de 30 km/h"],"c":3,"e":"B25 = vitesse minimale 30 km/h : on doit rouler à au moins 30, donc 30 ou plus.","flag":1},{"f":4,"n":18,"q":"Que m'indique le panneau B31 ?","img":"f4q18","o":["La fin de toutes les intersections sauf le « STOP »","La fin de tous les panneaux","La fin de tous les panneaux d'interdiction sauf ceux de stationnement et d'arrêt interdit"],"c":2,"e":"B31 = fin de toutes les interdictions, sauf celles de stationnement et d'arrêt."},{"f":4,"n":19,"q":"À quelle vitesse peut-on rouler à la vue du panneau B33 ?","img":"f4q19","o":["À n'importe quelle vitesse tout en respectant la réglementation en vigueur","À moins de 50 km/h","À plus de 50 km/h"],"c":0,"e":"Ce panneau met fin à la limitation : on reprend la vitesse réglementaire normale."},{"f":4,"n":20,"q":"Qu'indique le panneau B34 ?","img":"f4q20","o":["Le dépassement est interdit à tous véhicules","I ":5,"n":17,"q":"Lorsque vous voyez de profil l'agent réglant la circulation, que faire ?","o":["Je m'arrête","Je cède le passage à droite","Je passe","Je ralentis pour céder le passage"],"c":2,"e":"Agent vu de profil = voie ouverte : je passe."},{"f":5,"n":18,"q":"Lorsque je vois de face ou de dos l'agent réglant la circulation, que faire ?","o":["Je passe","Je ralentis et je passe","Je m'arrête","J'accélère"],"c":2,"e":"Agent vu de face ou de dos = arrêt (équivaut au feu rouge)."},{"f":5,"n":19,"q":"Quand l'agent réglant la circulation lève le bras, que faire ?","o":["Je passe si je suis déjà engagé dans l'intersection","Je ralentis et je passe, si je le vois de face","Je ralentis et je m'arrête, si je le vois de face"],"c":0,"e":"Bras levé = changement de phase (comme l'orange) : si je suis déjà engagé, je dégage.","flag":1},{"f":5,"n":20,"q":"De toutes les signalisations routières, laquelle prime sur les autres ?","o":["La signalisation lumineuse","La signalisation horizontale","La signalisation verticale","Les signes des agents"],"c":3,"e":"Ordre de priorité : les signes des agents priment sur tout le reste."},{"f":6,"n":1,"q":"À la vue de face ou de dos d'un agent réglant la circulation :","o":["Je passe","Je m'arrête","J'applique la règle de la priorité à droite"],"c":1,"e":"De face ou de dos = arrêt."},{"f":6,"n":2,"q":"À la vue de profil d'un agent réglant la circulation :","o":["Je passe","Je m'arrête","J'applique la règle de priorité à droite"],"c":0,"e":"De profil = voie ouverte : je passe."},{"f":6,"n":3,"q":"Le panneau triangle - flèche barrée (AB2) annonce que :","img":"f6q3","o":["Les usagers venant de gauche et de droite ont la priorité","Les usagers arrivant de gauche ou de droite perdent la priorité","Seuls les usagers arrivant de gauche perdent la priorité"],"c":1,"e":"AB2 : tu es prioritaire, donc ceux de gauche et de droite perdent la priorité."},{"f":6,"n":4,"q":"À la vue de la signalisation « STOP » (AB4), le conducteur doit :","img":"f6q4","o":["Marquer un arrêt et céder le passage à gauche et à droite","Céder le passage à droite seulement","Marquer l'arrêt après le panneau"],"c":0,"e":"STOP = arrêt obligatoire puis priorité à gauche et à droite."},{"f":6,"n":5,"q":"Que faire à une intersection dont le feu jaune clignote ?","o":["Céder le passage à ma gauche","Céder le passage à ma droite","Appliquer la priorité de passage"],"c":1,"e":"Jaune clignotant = priorité à droite : je cède à ceux qui viennent de ma droite."},{"f":6,"n":6,"q":"À la vue du panneau « STOP » (AB4), que dois-je faire ?","img":"f6q6","o":["Je cède le passage à droite","Je cède le passage à droite et à gauche","Je m'arrête et je cède le passage aux usagers venant de ma droite et de ma gauche"],"c":2,"e":"Arrêt complet, puis priorité à droite et à gauche."},{"f":6,"n":7,"q":"À la vue du panneau triangle pointe en bas (AB3a), que dois-je faire ?","img":"f6q7","o":["Je passe","Je cède le passage à droite seulement","Je cède le passage à droite et à gauche"],"c":2,"e":"« Cédez le passage » : je cède à droite comme à gauche."},{"f":6,"n":8,"q":"Le panneau B7b :","img":"f6q8","o":["Interdit le stationnement à tout véhicule à moteur sauf les camions","Interdit l'accès à tous les véhicules à moteur","Interdit l'accès à tous les véhicules sauf les camions"],"c":1,"e":"B7b = accès interdit à tous les véhicules à moteur."},{"f":6,"n":9,"q":"À la vue du panneau B6d :","img":"f6q9","o":["Je ne peux pas m'arrêter","Je ne peux pas m'arrêter mais je peux stationner","Je ne peux ni m'arrêter ni stationner"],"c":2,"e":"B6d (croix) = arrêt ET stationnement interdits."},{"f":6,"n":10,"q":"Que signifie le panneau B9c ?","img":"f6q10","o":["Accès interdit aux chevaux","Accès interdit aux véhicules agricoles à moteur","Accès interdit aux véhicules à traction animale"],"c":2,"e":"B9c = accès interdit aux véhicules à traction animale (attelages)."},{"f":6,"n":11,"q":"À quelle vitesse peut-on rouler à la vue du panneau B43 ?","img":"f6q11","o":["À 30 km/h","À QUESTIONS.forEach(q=>{q.id=q.f+"-"+q.n;q.letters=["A","B","C","D","E"];});
const byFiche=f=>QUESTIONS.filter(q=>q.f===f);
const EXAM_N=40,EXAM_SECONDS=30*60,EXAM_PASS=32;
const FICHE_TITLES={1:"Signalisation & lignes",2:"Panneaux de danger",3:"Panneaux d'interdiction",4:"Interdictions & vitesse",5:"Feux & agents",6:"Révision générale"};

const KEY="permis_benin_v2";
let store={stats:{},muted:false,streak:{count:0,last:null}};
try{const r=localStorage.getItem(KEY);if(r)store=Object.assign(store,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function st(id){return store.stats[id]||(store.stats[id]={seen:0,correct:0,lastOK:null});}
const today=()=>new Date().toISOString().slice(0,10);
function yday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function touchStreak(){const s=store.streak||{count:0,last:null};const t=today();
  if(s.last===t)return; s.count=(s.last===yday())?s.count+1:1; s.last=t; store.streak=s;}
function record(id,ok){const s=st(id);s.seen++;if(ok)s.correct++;s.lastOK=ok;touchStreak();save();}
const masteredF=f=>byFiche(f).filter(q=>{const s=store.stats[q.id];return s&&s.correct>0;}).length;
const mastered=()=>QUESTIONS.filter(q=>{const s=store.stats[q.id];return s&&s.correct>0;}).length;
function accuracy(){let a=0,c=0;for(const id in store.stats){a+=store.stats[id].seen;c+=store.stats[id].correct;}return a?Math.round(c/a*100):0;}
const errorList=()=>QUESTIONS.filter(q=>{const s=store.stats[q.id];return s&&s.lastOK===false;});
const answeredCount=()=>Object.values(store.stats).reduce((n,s)=>n+(s.seen>0?1:0),0);

let actx;
function tone(fr,ok){if(store.muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
  fr.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"sine":"square";o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const s=t+i*0.12;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(ok?.18:.14,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.13);o.start(s);o.stop(s+.14);});}catch(e){}}
const sOK=()=>tone([660,990],true),sKO=()=>tone([180,120],false);

const el=document.getElementById("app");
const ic=(n,c="i")=>`<svg class="${c}"><use href="#ic-${n}"/></svg>`;
const esc=s=>(s+"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ringSVG(pct,size,sw,g1,g2,id){const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e9eef7" stroke-width="${sw}" fill="none"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#${id})" stroke-width="${sw}" fill="none" stroke-linecap="round"
     transform="rotate(-90 ${size/2} ${size/2})" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
     style="--c:${c.toFixed(1)};--o:${off.toFixed(1)};animation:dash 1s .25s both ease-out"/>
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient></defs></svg>`;}

function qhead(title,sub,right,pct){return `<div class="qtop gut">
  <div class="qrow"><button class="rbtn" onclick="home()">${ic("chevl")}</button>
    <div class="qttl"><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>${right||""}</div>
  ${pct!=null?`<div class="qprog"><i style="width:${pct}%"></i></div>`:""}</div>`;}

/* ============ HOME ============ */
let tab="apercu";
function home(){
  const m=mastered(),pct=Math.round(m/120*100),acc=accuracy(),streak=(store.streak&&store.streak.count)||0,errN=errorList().length;
  el.innerHTML=`
  <div class="gut page">
    <div class="hd an"><div class="mark">${ic("light")}</div>
      <div class="ttl"><b>Révision</b><span>Code de la route · Bénin</span></div>
      <button class="mute" onclick="toggleMute(this)">${ic(store.muted?"mute":"vol")}</button></div>
    <div class="seg an" style="animation-delay:.03s">
      <button class="${tab==='apercu'?'on':''}" onclick="setTab('apercu')">Aperçu</button>
      <button class="${tab==='reviser'?'on':''}" onclick="setTab('reviser')">Réviser</button>
      <button class="${tab==='stats'?'on':''}" onclick="setTab('stats')">Stats</button>
    </div>
    <div id="tabc">${tabBody(tab,{m,pct,acc,streak,errN})}</div>
  </div>
  <div class="nav"><div class="in">
    <button class="${tab==='apercu'?'on':''}" onclick="setTab('apercu')">${ic("home")}<span>Aperçu</span></button>
    <button class="${tab==='reviser'?'on':''}" onclick="setTab('reviser')">${ic("book")}<span>Réviser</span></button>
    <button class="${tab==='stats'?'on':''}" onclick="setTab('stats')">${ic("chart")}<span>Stats</span></button>
    <button onclick="startErrors()">${ic("refresh")}<span>Erreurs</span></button>
  </div></div>`;
  window.scrollTo(0,0);
}
function setTab(t){tab=t;home();}
function toggleMute(b){store.muted=!store.muted;save();b.innerHTML=ic(store.muted?"mute":"vol");}

function tabBody(t,d){
  if(t==='apercu')return apercu(d);
  if(t==='reviser')return reviser(d);
  return stats(d);
}
function apercu(d){
  const nextF=[1,2,3,4,5,6].find(f=>masteredF(f)<20)||1;
  return `
  <div class="hero an" style="animation-delay:.05s"><div class="bl"></div><div class="bl2"></div>
    <div class="tag">Chapitre II · Signalisations</div>
    <h2>${d.m?"Continue ta progression":"Commence ta révision"}</h2>
    <p>${d.m?("Prochaine étape : Fiche "+nextF+" — "+FICHE_TITLES[nextF]):"120 questions, 6 fiches, prêt quand tu l'es."}</p>
    <div class="pbar"><i style="width:${d.pct}%"></i></div>
    <div class="pr"><span>${d.pct}% du chapitre</span><span>${d.m}/120</span></div>
    <button class="go" onclick="cont()">${ic("play")}</button>
  </div>
  <div class="ovc an" style="animation-delay:.1s">
    <div class="ring">${ringSVG(d.pct,104,9,"#2f6df6","#7a3bff","ga")}<div class="pc"><b>${d.pct}%</b><span>maîtrise</span></div></div>
    <div class="kpis">
      <div class="kpi"><div class="ic" style="background:#eef0ff;color:#4f46e5">${ic("target")}</div><div><b>${d.m}<span style="color:var(--mut);font-size:.8rem;font-family:var(--font)">/120</span></b><span>maîtrisées</span></div></div>
      <div class="kpi"><div class="ic" style="background:#e8faef;color:var(--good)">${ic("check")}</div><div><b>${d.acc}%</b><span>précision</span></div></div>
      <div class="kpi"><div class="ic" style="background:#fff0eb;color:#ff6a2b">${ic("flame")}</div><div><b>${d.streak} jour${d.streak>1?"s":""}</b><span>série en cours</span></div></div>
    </div>
  </div>
  <div class="qa an" style="animation-delay:.15s">
    <button onclick="start(QUESTIONS.slice(),'train','Entraînement')"><div class="ic" style="background:linear-gradient(135deg,#2f6df6,#5b8cff)">${ic("target")}</div><div><b>Entraînement</b><span>Avec correction</span></div></button>
    <button onclick="start(shuffle(QUESTIONS).slice(0,${EXAM_N}),'exam','Examen blanc')"><div class="ic" style="background:linear-gradient(135deg,#7a3bff,#b84dff)">${ic("clock")}</div><div><b>Examen</b><span>40 Q chrono</span></div></button>
  </div>`;
}
function reviser(d){
  const fiches=[1,2,3,4,5,6].map(f=>{const mc=masteredF(f),p=Math.round(mc/20*100);
    return `<button class="fiche" onclick="start(byFiche(${f}),'train','Fiche ${f}')"><div class="num">${f}</div><div class="lb">${esc(FICHE_TITLES[f])}</div><div class="mini"><i style="width:${p}%"></i></div><div class="mv">${mc}/20</div></button>`;}).join("");
  return `
  <div class="sh an">Modes de révision</div>
  <div class="modes">
    <button class="md an" style="animation-delay:.02s" onclick="start(QUESTIONS.slice(),'train','Entraînement')"><div class="ic" style="background:linear-gradient(135deg,#2f6df6,#5b8cff)">${ic("target")}</div><b>Entraînement</b><span>Correction + son</span></button>
    <button class="md an" style="animation-delay:.06s" onclick="start(shuffle(QUESTIONS).slice(0,${EXAM_N}),'exam','Examen blanc')"><div class="ic" style="background:linear-gradient(135deg,#7a3bff,#b84dff)">${ic("clock")}</div><b>Examen blanc</b><span>40 Q chrono</span></button>
    <button class="md an" style="animation-delay:.1s" onclick="startErrors()">${d.errN?`<span class="bdg">${d.errN}</span>`:""}<div class="ic" style="background:linear-gradient(135deg,#ff7a59,#f0453f)">${ic("refresh")}</div><b>Mes erreurs</b><span>${d.errN?d.errN+" à revoir":"Rien à revoir"}</span></button>
    <button class="md an" style="animation-delay:.14s" onclick="start(shuffle(QUESTIONS),'train','Tout mélanger')"><div class="ic" style="background:linear-gradient(135deg,#12b3a6,#19b45a)">${ic("shuffle")}</div><b>Tout mélanger</b><span>120 Q désordre</span></button>
  </div>
  <div class="sh an" style="animation-delay:.12s">Les 6 fiches</div>
  <div class="fiches an" style="animation-delay:.14s">${fiches}
    <button class="mix" onclick="start(shuffle(QUESTIONS),'train','Tout mélanger')">${ic("shuffle")} Tout mélanger</button>
  </div>`;
}
function stats(d){
  const bars=[1,2,3,4,5,6].map(f=>{const mc=masteredF(f),p=Math.round(mc/20*100);
    return `<div class="brow"><span class="nm">Fiche ${f}</span><div class="track"><i style="width:${p}%"></i></div><span class="vv">${mc}/20</span></div>`;}).join("");
  return `
  <div class="sh an">Progression par fiche</div>
  <div class="bars an" style="animation-delay:.03s">${bars}</div>
  <div class="sh an" style="animation-delay:.06s">Mes chiffres</div>
  <div class="scards an" style="animation-delay:.08s">
    <div class="sc"><div class="ic" style="background:#eef0ff;color:#4f46e5">${ic("target")}</div><b>${d.m}/120</b><span>Questions maîtrisées</span></div>
    <div class="sc"><div class="ic" style="background:#e8faef;color:var(--good)">${ic("check")}</div><b>${d.acc}%</b><span>Précision globale</span></div>
    <div class="sc"><div class="ic" style="background:#fff0eb;color:#ff6a2b">${ic("flame")}</div><b>${d.streak}</b><span>Jours de série</span></div>
    <div class="sc"><div class="ic" style="background:#f0ecff;color:#7a3bff">${ic("layers")}</div><b>${answeredCount()}/120</b><span>Questions vues</span></div>
  </div>
  ${d.errN?`<button class="cta sec an" style="animation-delay:.1s" onclick="startErrors()">${ic("refresh")} Revoir mes ${d.errN} erreurs</button>`:`<div class="empty"><div class="ic">${ic("check")}</div><b>Aucune erreur en attente</b></div>`}
  <div style="text-align:center;margin-top:18px"><button onclick="resetAll()" style="font-size:.8rem;color:var(--mut);text-decoration:underline;padding:8px">Réinitialiser ma progression</button></div>`;
}
function cont(){const f=[1,2,3,4,5,6].find(x=>masteredF(x)<20);if(f)start(byFiche(f),'train','Fiche '+f);else start(QUESTIONS.slice(),'train','Entraînement');}
function resetAll(){store.stats={};store.streak={count:0,last:null};save();home();}

/* ============ SESSION ============ */
let S=null,timerInt=null;
function start(list,mode,title){if(!list.length){home();return;}S={list,mode,title,idx:0,answered:[],correct:0,left:EXAM_SECONDS};clearInterval(timerInt);if(mode==="exam")timerInt=setInterval(tick,1000);render();}
function startErrors(){const e=errorList();if(!e.length){el.innerHTML=emptyErr();window.scrollTo(0,0);return;}start(shuffle(e),'errors','Mes erreurs');}
function tick(){S.left--;const t=document.getElementById("tmr");if(t){t.querySelector("span").textContent=fmt(S.left);if(S.left<=60)t.classList.add("low");}if(S.left<=0){clearInterval(timerInt);finish();}}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function render(){
  const q=S.list[S.idx],exam=S.mode==="exam",pct=Math.round(S.idx/S.list.length*100);
  const right=exam?`<div class="tpill" id="tmr">${ic("clock")}<span>${fmt(S.left)}</span></div>`:`<div class="spill">${ic("check")}<span>${S.correct}</span></div>`;
  const img=q.img?`<div class="signwrap"><div class="box"><img src="${IMAGES[q.img]}" alt="panneau"></div></div>`:"";
  const opts=q.o.map((o,i)=>`<button class="o" id="o${i}" onclick="answer(${i})"><span class="k">${q.letters[i]}</span><span class="lab">${esc(o)}</span>${ic("check","mk")}</button>`).join("");
  el.innerHTML=qhead(S.title,"Question "+(S.idx+1)+" / "+S.list.length,right,pct)+`
  <div class="gut qbody">
    ${img}
    <div class="q">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts}</div>
    <div id="after"></div>
  </div>`;
  window.scrollTo(0,0);
}
function answer(i){
  const q=S.list[S.idx],exam=S.mode==="exam";
  if(S.answered[S.idx]!=null)return; S.answered[S.idx]=i; const ok=i===q.c; if(ok)S.correct++;
  if(exam){const b=document.getElementById("o"+i);b.classList.add(ok?"good":"bad");setTimeout(nextQ,170);return;}
  record(q.id,ok); ok?sOK():sKO();
  const opts=document.getElementById("opts");
  [...opts.children].forEach((b,idx)=>{b.setAttribute("disabled","");if(idx===q.c)b.classList.add("good");else if(idx===i)b.classList.add("bad");else b.classList.add("dim");});
  const sc=document.querySelector(".spill span");if(sc)sc.textContent=S.correct;
  const flag=q.flag?`<div class="flag">${ic("warn")}<span>Réponse à confirmer avec ton auto-école (spécificité du manuel Bénin 2011).</span></div>`:"";
  const last=S.idx===S.list.length-1;
  document.getElementById("after").innerHTML=`
    <div class="expl ${ok?"ok":"ko"}" style="margin-top:4px">
      <span class="vd">${ok?ic("check")+"Bonne réponse":ic("x")+"Mauvaise réponse — la bonne est "+q.letters[q.c]}</span>
      ${esc(q.e)}${flag}</div>
    <button class="cta" style="margin-top:14px" onclick="nextQ()">${last?"Voir mon résultat":"Question suivante"} ${ic("chev")}</button>`;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){if(S.idx>=S.list.length-1){finish();return;}S.idx++;render();}

function finish(){
  clearInterval(timerInt);
  const n=S.list.length,c=S.correct,pct=Math.round(c/n*100),exam=S.mode==="exam";
  const pass=exam?c>=EXAM_PASS:pct>=80;
  const col=pass?"#17ac57":(pct>=50?"#b9770f":"#f0453f"),g2=pass?"#3fd07f":(pct>=50?"#f0b24a":"#ff7a6e");
  const wrong=S.list.map((q,i)=>({q,i})).filter(o=>S.answered[o.i]!==o.q.c);
  const rev=wrong.length?`<div class="sh" style="margin-top:20px">À revoir (${wrong.length})</div><div class="review">`+wrong.map(o=>`
      <div class="rev"><div class="rq">F${o.q.f}·Q${o.q.n} — ${esc(o.q.q)}</div>
      <div class="ra g">${ic("check")}${esc(o.q.letters[o.q.c]+". "+o.q.o[o.q.c])}</div>
      ${o.answered!=null||S.answered[o.i]!=null?`<div class="ra k">${ic("x")}Ta réponse : ${esc(o.q.letters[S.answered[o.i]]+". "+o.q.o[S.answered[o.i]])}</div>`:`<div class="ra k">${ic("x")}Sans réponse</div>`}
      </div>`).join("")+`</div>`:`<div class="empty"><div class="ic">${ic("trophy")}</div><b>Sans faute, bravo !</b></div>`;
  el.innerHTML=qhead(S.title,"Résultat",null,null)+`
  <div class="gut qbody">
    <div class="rhead">
      <div class="rring">${ringSVG(pct,168,13,col,g2,"gr")}<div class="pc"><b style="color:${col}">${c}/${n}</b><span>${pct}%</span></div></div>
      <div class="vbig">${exam?(pass?"Réussi":"Encore un effort"):(pct>=80?"Excellent":pct>=50?"Pas mal":"À retravailler")}</div>
      ${exam?`<div class="rsub">Seuil de réussite indicatif : ${EXAM_PASS}/${EXAM_N}</div>`:`<div class="rsub">${c} bonne${c>1?"s":""} réponse${c>1?"s":""} sur ${n}</div>`}
    </div>
    <button class="cta" onclick="replay()">${ic("refresh")} Recommencer</button>
    ${wrong.length?`<button class="cta sec" onclick="revoirErr(${JSON.stringify(wrong.map(o=>o.q.id)).replace(/"/g,"&quot;")})">Revoir seulement mes ${wrong.length} erreurs</button>`:""}
    <button class="cta sec" onclick="home()">${ic("home")} Accueil</button>
    ${rev}
  </div>`;
  window.scrollTo(0,0);
}
function replay(){if(S.mode==="exam")start(shuffle(QUESTIONS).slice(0,EXAM_N),'exam','Examen blanc');else if(S.mode==="errors")startErrors();else start(S.list.map(q=>q),'train',S.title);}
function revoirErr(ids){const list=ids.map(id=>QUESTIONS.find(q=>q.id===id));start(list,'train','Révision des erreurs');}

function emptyErr(){return qhead("Mes erreurs",null,null,null)+`
  <div class="gut qbody"><div class="empty"><div class="ic">${ic("check")}</div><b>Aucune erreur à revoir</b>
  <div style="font-size:.88rem">Fais quelques questions en entraînement : celles que tu rates arriveront ici automatiquement.</div>
  <button class="cta" style="max-width:280px" onclick="start(QUESTIONS.slice(),'train','Entraînement')">${ic("target")} Commencer l'entraînement</button></div></div>`;}

home();
</script>
